services:
  couchdb:
    image: couchdb:3
    container_name: credito_couchdb
    restart: unless-stopped

    environment:
      COUCHDB_USER: ${COUCHDB_USERNAME:?Usa --env-file Backend/credito_backend/.env y define COUCHDB_USERNAME}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Define COUCHDB_PASSWORD en Backend/credito_backend/.env}

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5984/_up"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

    ports:
      - "5984:5984"

    volumes:
      - couchdb_data:/opt/couchdb/data

    networks:
      - credito_network

  backend:
    build:
      context: ..                     # raíz del repo
      dockerfile: docker/Dockerfile   # ruta relativa al contexto

    container_name: credito_backend
    restart: unless-stopped

    depends_on:
      couchdb:
        condition: service_healthy

    environment:
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_USERNAME: ${COUCHDB_USERNAME:?Define COUCHDB_USERNAME en Backend/credito_backend/.env}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Define COUCHDB_PASSWORD en Backend/credito_backend/.env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en Backend/credito_backend/.env}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}

    ports:
      - "3000:3000"

    networks:
      - credito_network

volumes:
  couchdb_data:

networks:
  credito_network:
    driver: bridge
